<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 { text-align: center; }
        .disp { width: 205px; height: 40px; margin-top: 3px; }
        .disp { text-align: right; font-family: "Oxanium", sans-serif; font-size: 22pt; }
        input[type=button] { 
            width: 50px; height: 50px; margin-top: 5px;
            text-align: center; vertical-align: middle; 
        }
        #calc { width: 220px; margin-left: auto; margin-right: auto; }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // 수식 문자열을 받아서 계산 결과를 돌려주는 함수
        function calculate(expr) {
            let nums = [];   // 숫자들을 담는 배열
            let ops = [];    // 연산자들을 담는 배열
            let temp = "";   // 숫자를 한 글자씩 모으는 변수

            // 1단계: 한 글자씩 읽으면서 숫자와 연산자를 나눠 담기
            for (let i = 0; i < expr.length; i++) {
                let ch = expr[i];

                if (ch == "+" || ch == "-" || ch == "*" || ch == "/") {
                    if (temp == "") {
                        return "Error";   // 연산자가 연속으로 나오면 오류
                    }
                    nums.push(Number(temp));
                    ops.push(ch);
                    temp = "";
                }
                else {
                    temp = temp + ch;
                }
            }

            // 마지막 숫자 담기 (수식이 연산자로 끝났으면 오류)
            if (temp == "") {
                return "Error";
            }
            nums.push(Number(temp));

            // 2단계: *, / 먼저 계산하기
            let i = 0;
            while (i < ops.length) {
                if (ops[i] == "*" || ops[i] == "/") {
                    let r = 0;
                    if (ops[i] == "*") {
                        r = nums[i] * nums[i + 1];
                    }
                    else {
                        if (nums[i + 1] == 0) {
                            return "Error";   // 0으로 나누기
                        }
                        r = nums[i] / nums[i + 1];
                    }
                    // 계산한 두 숫자를 결과 하나로 바꾸고, 연산자 하나 제거
                    nums.splice(i, 2, r);
                    ops.splice(i, 1);
                }
                else {
                    i++;   // + 나 - 면 일단 넘어감
                }
            }

            // 3단계: 남은 +, - 를 왼쪽부터 계산하기
            let result = nums[0];
            for (let j = 0; j < ops.length; j++) {
                if (ops[j] == "+") {
                    result = result + nums[j + 1];
                }
                else {
                    result = result - nums[j + 1];
                }
            }

            return result;
        }

        $(document).ready(function(){

            // 숫자 버튼: disp2 뒤에 숫자 이어 붙이기
            $(".num").click(function(){
                let cur = $("#disp2").val();
                let n = $(this).val();
                $("#disp2").val(cur + n);
            });

            // 연산자 버튼
            $(".op").click(function(){
                let cur = $("#disp2").val();
                let n = $(this).val();

                if (n != "=") {
                    $("#disp2").val(cur + n);
                }
                else {
                    if (cur == "") {
                        return;
                    }
                    let result = calculate(cur);
                    $("#disp1").val(cur);      // 원래 수식
                    $("#disp2").val(result);   // 계산 결과
                }
            });

            // AC 버튼: 두 화면 모두 초기화
            $(".func").click(function(){
                $("#disp1").val("");
                $("#disp2").val("");
            });
        });
    </script>
</head>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2" readonly>
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>
        <input type="button" class="func" value="AC">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="=">
        <input type="button" class="op" value="/">
    </div>
</body>
</html>
