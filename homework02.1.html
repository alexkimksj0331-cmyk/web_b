<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 시간표</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gugi&display=swap" rel="stylesheet">
    <style>
        .t1 {
            font-family: "Gugi", sans-serif;
            text-align: center;
        }

        body {
            background-color: #f8f9fa;
        }

        table {
            width: 700px;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: #ffffff;
            border: 2px solid #333333;
        }

        th, td {
            width: 110px;
            height: 45px;
            text-align: center;
            vertical-align: middle;
            border: 1px solid #cccccc;
        }

        thead th {
            background-color: #e2e8f0;
            height: 40px;
        }

        tbody th {
            background-color: #f1f5f9;
            width: 60px;
        }

        .thermo { background-color: #e0f2fe; }
        .japan { background-color: #fce7f3; }
        .chapel { background-color: #eee1ad; }
        .history { background-color: #dcfce7; }
        .web { background-color: #e0e7ff; }
        .econ { background-color: #ffedd5; }
        .semi { background-color: #f3e8ff; }
        .career { background-color: #ffe4e6; }
    </style>
</head>
<body>

    <h1 class="t1">강의 시간표</h1>

    <table>
        <thead>
            <tr>
                <th>교시</th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>1</th>
                <td></td>
                <td></td>
                <td></td>
                <td rowspan="3" class="thermo">열역학</td>
                <td></td>
            </tr>
            <tr>
                <th>2</th>
                <td></td>
                <td rowspan="3" class="japan">대학 교양일본어</td>
                <td class="chapel">채플</td>
                <td></td>
            </tr>
            <tr>
                <th>3</th>
                <td></td>
                <td rowspan="2" class="history">역사와문화</td>
                <td></td>
            </tr>
            <tr>
                <th>4</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th>5</th>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th>6</th>
                <td></td>
                <td rowspan="3" class="web">웹프로그래밍</td>
                <td rowspan="3" class="econ">경제학원론</td>
                <td rowspan="3" class="semi">AI반도체공정</td>
                <td></td>
            </tr>
            <tr>
                <th>7</th>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th>8</th>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th>9</th>
                <td></td>
                <td class="career">인생설계와 진로</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
